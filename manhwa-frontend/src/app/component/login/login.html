<div class="login-container">
  <h2>Login</h2>

  <form (ngSubmit)="onLogin()" class="login-form">
    <label>
      Usuário:
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Digite seu usuário"
        required
      />
    </label>

    <label>
      Senha:
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Digite sua senha"
        required
      />
    </label>

    <button type="submit">Entrar</button>
  </form>
</div>
